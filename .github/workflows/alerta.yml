name: Notificacion de Deploy a ntfy

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Ejecutar el programa Hola Mundo
        run: node index.js

      - name: Enviar notificación personalizada a ntfy.sh
        run: |
          curl \
            -H "Title: Despliegue Exitoso - Hola Mundo" \
            -H "Tags: rocket,white_check_mark" \
            -d "Se ha realizado un push exitoso a la rama main. Estudiante: Yhadel Lopez (Matrícula: 20242493). Repositorio: https://github.com/Yhadel/hola-mundo-actions.git" \
            ntfy.sh/devops-itla
